name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@aries0d0f'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Determine release title
        id: version
        run: |
          bunx changeset status --since=origin/main --output="$RUNNER_TEMP/changeset-status.json"
          TITLE=$(node -e "
            const { releases } = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
            const [release] = releases;
            if (release) process.stdout.write(\`build: Release \${release.name}@\${release.newVersion}\`);
          " "$RUNNER_TEMP/changeset-status.json")
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create/update Version Packages PR
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: ${{ steps.version.outputs.title }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        id: npm-publish
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          bun run release
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push git tags
        if: steps.npm-publish.outputs.published == 'true'
        run: git push origin --tags

      - name: Setup Node for GitHub Packages
        if: steps.npm-publish.outputs.published == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@aries0d0f'

      - name: Publish to GitHub Packages
        if: steps.npm-publish.outputs.published == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
