name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: '@aries0d0f'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Determine release title
        id: version
        run: |
          # Checked out as a detached SHA, so changesets cannot resolve its baseBranch.
          git branch -f main HEAD
          bunx changeset status --output="$RUNNER_TEMP/changeset-status.json"
          TITLE=$(node -p "
            const [release] = require(process.argv[1]).releases;
            release ? \`build: Release \${release.name}@\${release.newVersion}\` : ''
          " "$RUNNER_TEMP/changeset-status.json")
          echo "Resolved title: ${TITLE:-<none, nothing to release>}"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create/update Version Packages PR, or publish
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: ${{ steps.version.outputs.title }}
          publish-script: bun run release
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node for GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@aries0d0f'

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
